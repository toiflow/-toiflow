name: must-update-content

on:
  workflow_call:
    inputs:
      prompt:
        description: Prompt to send to Ollama
        type: string
        required: true
      model:
        description: Ollama model name
        type: string
        default: qwen2.5:7b
    outputs:
      response:
        description: Ollama response text
        value: ${{ jobs.run.outputs.response }}

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      response: ${{ steps.call.outputs.response }}
    steps:
      - id: call
        env:
          OLLAMA_SECRET: ${{ secrets.OLLAMA_SECRET }}
          OLLAMA_URL: https://local.toigroup.co.nz/api/generate
        run: |
          BODY=$(jq -n \
            --arg model "${{ inputs.model }}" \
            --arg prompt "${{ inputs.prompt }}" \
            '{model: $model, prompt: $prompt, stream: false}')

          echo "🔑 OLLAMA_SECRET length: ${#OLLAMA_SECRET}"

          RAW=$(curl -sw "\nHTTP_STATUS:%{http_code}" -X POST "$OLLAMA_URL" \
            -H "Content-Type: application/json" \
            -H "x-secret: $OLLAMA_SECRET" \
            -d "$BODY")
          HTTP_STATUS=$(echo "$RAW" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY_RAW=$(echo "$RAW" | sed '/HTTP_STATUS:/d')
          echo "📡 HTTP status: $HTTP_STATUS"

          RESPONSE=$(echo "$BODY_RAW" | jq -r '.response' 2>/dev/null)

          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
            echo "❌ Empty or null response from Ollama"
            echo "Raw body (first 300 chars): ${BODY_RAW:0:300}"
            exit 1
          fi

          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
